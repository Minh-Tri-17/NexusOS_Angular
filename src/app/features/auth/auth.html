<div class="auth-bg-gradient"></div>
<div class="auth-glow-orb auth-glow-orb-1"></div>
<div class="auth-glow-orb auth-glow-orb-2"></div>

<div class="auth-topbar topbar-action-group">
  <app-languages></app-languages>

  <button
    class="btn-icon-action"
    id="themeToggleBtn"
    title="Toggle Light/Dark Theme"
    (click)="handleToggleTheme()"
  >
    <i class="fa-regular" [class]="themeService.isDark() ? 'fa-sun' : 'fa-moon'"></i>
  </button>
</div>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-brand-side">
      <div>
        <div class="d-flex align-items-center gap-3 mb-4 animate-item delay-1">
          <img
            src="/logo.png"
            alt="Nexus Logo"
            class="brand-logo-img"
            style="height: 48px; width: auto"
          />
          <div>
            <h1 class="brand-title m-0 fs-3">Nexus</h1>
            <div
              class="brand-subtitle text-uppercase font-mono text-muted"
              style="font-size: 0.72rem; letter-spacing: 0.12em"
            >
              {{ 'auth.brandSubtitle' | translate }}
            </div>
          </div>
        </div>

        <div class="brand-badge-pill animate-item delay-2">
          <i class="fa-solid fa-cube"></i> {{ 'auth.enterprisePortal' | translate }} v2.4.0
        </div>

        <h2 class="auth-title animate-item delay-2">{{ 'auth.enterprisePlatform' | translate }}</h2>

        <div class="topic-showcase mb-0">
          <img src="/topic.png" alt="Nexus Enterprise Overview" class="topic-img" />
        </div>
      </div>
    </div>

    <app-login-form></app-login-form>
  </div>
</div>
