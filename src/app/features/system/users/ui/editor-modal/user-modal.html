<app-modal>
  <ng-container modal-eyebrow>{{ 'user.modalTitle' | translate }}</ng-container>
  <ng-container modal-title>{{ title() | translate }} {{ 'common.user' | translate }}</ng-container>
  <ng-container modal-header-extra
    ><span class="badge-soft badge-teal d-none d-sm-inline-flex"
      ><i class="fa-solid fa-bolt"></i> {{ 'common.liveSync' | translate }}</span
    ></ng-container
  >
  <ng-container modal-form>
    <form id="userEditorForm" [formGroup]="userForm" ngNativeValidate (ngSubmit)="handleSave()">
      <div class="modal-body px-4 py-3 position-relative z-1">
        <div class="form-section-card mb-4">
          <div class="form-section-header">
            <div class="d-flex align-items-center gap-2">
              <i class="fa-solid fa-user-shield text-primary"></i
              ><span class="fw-bold">{{ 'user.userInfo' | translate }}</span>
            </div>
            <span class="badge-soft badge-indigo"
              ><i class="fa-solid fa-list-check"></i> 7 {{ 'common.fields' | translate }}</span
            >
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label for="userCode" class="form-label custom-form-label">{{
                'user.userCode' | translate
              }}</label
              ><input
                class="form-control custom-form-control"
                id="userCode"
                formControlName="userCode"
              />
            </div>
            <div class="col-md-6">
              <label for="username" class="form-label custom-form-label"
                >{{ 'user.username' | translate }} <span class="text-danger">*</span></label
              ><input
                class="form-control custom-form-control"
                id="username"
                formControlName="username"
                required
              />
            </div>
            <div class="col-md-6">
              <label for="email" class="form-label custom-form-label">{{
                'user.email' | translate
              }}</label
              ><input
                type="email"
                class="form-control custom-form-control"
                id="email"
                formControlName="email"
              />
            </div>
            <div class="col-md-6">
              <label for="phoneNumber" class="form-label custom-form-label">{{
                'user.phoneNumber' | translate
              }}</label
              ><input
                class="form-control custom-form-control"
                id="phoneNumber"
                formControlName="phoneNumber"
              />
            </div>
            <div class="col-md-6">
              <label for="userStatus" class="form-label custom-form-label">{{
                'user.userStatus' | translate
              }}</label
              ><select
                class="form-select custom-form-control"
                id="userStatus"
                formControlName="userStatus"
              >
                <option value="Active">{{ 'user.active' | translate }}</option>
                <option value="Inactive">{{ 'user.inactive' | translate }}</option>
                <option value="Locked">{{ 'user.locked' | translate }}</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="userType" class="form-label custom-form-label">{{
                'user.userType' | translate
              }}</label
              ><select
                class="form-select custom-form-control"
                id="userType"
                formControlName="userType"
              >
                <option value="Employee">{{ 'user.employee' | translate }}</option>
                <option value="External">{{ 'user.external' | translate }}</option>
                <option value="System">{{ 'user.system' | translate }}</option>
              </select>
            </div>
            <div class="col-md-6 form-check form-switch ps-5">
              <input
                class="form-check-input"
                type="checkbox"
                id="requirePasswordChange"
                formControlName="requirePasswordChange"
              /><label class="form-check-label" for="requirePasswordChange">{{
                'user.requirePasswordChange' | translate
              }}</label>
            </div>
            <div class="col-md-6 form-check form-switch ps-5">
              <input
                class="form-check-input"
                type="checkbox"
                id="twoFactorEnabled"
                formControlName="twoFactorEnabled"
              /><label class="form-check-label" for="twoFactorEnabled">{{
                'user.twoFactorEnabled' | translate
              }}</label>
            </div>
          </div>
        </div>
        <div class="form-section-card">
          <div class="form-section-header">
            <span class="fw-bold">{{ 'common.otherInfo' | translate }}</span>
          </div>
          <textarea
            class="form-control custom-form-control"
            rows="3"
            formControlName="note"
            placeholder="{{ 'common.placeholderNote' | translate }}"
          ></textarea>
        </div>
      </div>
    </form>
  </ng-container>
  <ng-container modal-actions
    ><button
      type="submit"
      form="userEditorForm"
      class="btn btn-sm btn-pastel-purple px-4 py-2 rounded-3"
    >
      @if (isSaving()) {
        <span class="spinner-border spinner-border-sm me-1"></span>{{ 'common.saving' | translate }}
      } @else {
        <i class="fa-solid fa-floppy-disk me-1"></i>{{ 'common.save' | translate }}
      }
    </button></ng-container
  >
</app-modal>
