<app-modal modalId="countryEditorModal">
  <ng-container modal-eyebrow>GLOBAL GEOGRAPHY MODULE</ng-container>

  <ng-container modal-title>{{ title() }} Country</ng-container>

  <ng-container modal-header-extra>
    <span class="badge-soft badge-teal d-none d-sm-inline-flex">
      <i class="fa-solid fa-bolt"></i> Live Sync
    </span>
  </ng-container>

  <ng-container modal-form>
    <form
      id="countryEditorForm"
      [formGroup]="countryForm"
      ngNativeValidate
      (ngSubmit)="handleSave()"
    >
      <div class="modal-body px-4 py-3 position-relative z-1">
        <div class="form-section-card">
          <div class="form-section-header">
            <div class="d-flex align-items-center gap-2">
              <i class="fa-solid fa-globe text-primary"></i>
              <span class="fw-bold">GEOGRAPHIC IDENTIFICATION</span>
            </div>
            <span class="badge-soft badge-indigo">
              <i class="fa-solid fa-list-check"></i> 5 fields
            </span>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label for="inputCountryCode" class="form-label custom-form-label">
                Country Code (ISO)
              </label>
              <div class="input-group custom-input-group">
                <span class="input-group-text"><i class="fa-solid fa-passport"></i></span>
                <input
                  type="text"
                  class="form-control custom-form-control disable"
                  id="inputCountryCode"
                  placeholder="e.g. VN, US, JP"
                  formControlName="countryCode"
                />
              </div>
              <div class="form-text-hint">
                <i class="fa-solid fa-circle-info"></i> Standard ISO 3166-1 alpha-2 code
              </div>
            </div>

            <div class="col-md-6">
              <label for="inputCountryName" class="form-label custom-form-label">
                Country Name <span class="text-danger fw-bold">*</span>
              </label>
              <div class="input-group custom-input-group">
                <span class="input-group-text"><i class="fa-solid fa-flag"></i></span>
                <input
                  type="text"
                  class="form-control custom-form-control"
                  id="inputCountryName"
                  placeholder="e.g. Vietnam, Japan"
                  formControlName="countryName"
                  required
                />
              </div>
            </div>

            <div class="col-md-6">
              <label for="inputCountryRegion" class="form-label custom-form-label">
                Region / Continent
                <span class="text-danger fw-bold">*</span>
              </label>
              <div class="input-group custom-input-group">
                <span class="input-group-text"><i class="fa-solid fa-compass"></i></span>
                <select
                  class="form-select custom-form-select"
                  id="inputCountryRegion"
                  formControlName="region"
                  required
                >
                  <option value="" selected>Select Region...</option>
                  @for (region of regions; track region) {
                    <option [value]="region">{{ region }}</option>
                  }
                </select>
              </div>
            </div>

            <div class="col-md-6">
              <label for="inputCountryCapital" class="form-label custom-form-label">
                Capital
                <span class="text-danger fw-bold">*</span>
              </label>
              <div class="input-group custom-input-group">
                <span class="input-group-text"><i class="fa-solid fa-city"></i></span>
                <input
                  type="text"
                  class="form-control custom-form-control"
                  id="inputCountryCapital"
                  placeholder="e.g. Hanoi, Washington D.C., Tokyo"
                  formControlName="capital"
                  required
                />
              </div>
            </div>

            <div class="col-12">
              <label for="inputCountryDescription" class="form-label custom-form-label">
                Description
              </label>
              <div class="input-group custom-input-group">
                <span class="input-group-text"><i class="fa-solid fa-align-left"></i></span>
                <textarea
                  class="form-control custom-form-control"
                  id="inputCountryDescription"
                  rows="3"
                  placeholder="Enter country description..."
                  formControlName="note"
                >
                </textarea>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </ng-container>

  <ng-container modal-actions>
    <button
      type="submit"
      form="countryEditorForm"
      class="btn btn-sm btn-pastel-purple px-4 py-2 rounded-3"
    >
      <i class="fa-solid fa-floppy-disk me-1"></i> Save Changes
    </button>
  </ng-container>
</app-modal>
