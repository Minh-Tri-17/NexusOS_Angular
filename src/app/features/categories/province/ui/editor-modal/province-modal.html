<app-modal>
  <ng-container modal-eyebrow>{{ 'province.modalTitle' | translate }}</ng-container>
  <ng-container modal-title>
    {{ title() | translate }} {{ 'common.province' | translate }}
  </ng-container>
  <ng-container modal-header-extra>
    <span class="badge-soft badge-teal d-none d-sm-inline-flex">
      <i class="fa-solid fa-bolt"></i> {{ 'common.liveSync' | translate }}
    </span>
  </ng-container>

  <ng-container modal-form>
    <form
      id="provinceEditorForm"
      [formGroup]="provinceForm"
      ngNativeValidate
      (ngSubmit)="handleSave()"
    >
      <div class="modal-body px-4 py-3 position-relative z-1">
        <!-- Form Section 1: Province Info -->
        <div class="form-section-card mb-4">
          <div class="form-section-header">
            <div class="d-flex align-items-center gap-2">
              <i class="fa-solid fa-map-location-dot text-primary"></i>
              <span class="fw-bold">{{ 'province.provinceInfo' | translate }}</span>
            </div>
            <span class="badge-soft badge-indigo">
              <i class="fa-solid fa-list-check"></i> 3 {{ 'common.fields' | translate }}
            </span>
          </div>

          <div class="row g-3">
            <div class="col-md-6">
              <label for="inputProvinceCode" class="form-label custom-form-label">
                {{ 'province.provinceCode' | translate }}
              </label>
              <div class="input-group custom-input-group">
                <span class="input-group-text"><i class="fa-solid fa-barcode"></i></span>
                <input
                  type="text"
                  class="form-control custom-form-control"
                  id="inputProvinceCode"
                  placeholder="e.g. HN, HCM, DN"
                  formControlName="provinceCode"
                />
              </div>
            </div>

            <div class="col-md-6">
              <label for="inputProvinceName" class="form-label custom-form-label">
                {{ 'province.provinceName' | translate }} <span class="text-danger">*</span>
              </label>
              <div class="input-group custom-input-group">
                <span class="input-group-text"><i class="fa-solid fa-map"></i></span>
                <input
                  type="text"
                  class="form-control custom-form-control"
                  id="inputProvinceName"
                  placeholder="e.g. Hà Nội, TP. Hồ Chí Minh"
                  formControlName="provinceName"
                  required
                />
              </div>
            </div>

            <div class="col-md-12">
              <label for="inputCountryId" class="form-label custom-form-label">
                {{ 'province.countryName' | translate }} <span class="text-danger">*</span>
              </label>
              <div class="input-group custom-input-group">
                <span class="input-group-text"><i class="fa-solid fa-globe"></i></span>
                <select
                  class="form-select custom-form-select"
                  id="inputCountryId"
                  formControlName="countryId"
                  required
                >
                  <option value="">
                    {{ 'common.selectCountry' | translate }}
                  </option>
                  @for (country of countries(); track country.id) {
                    <option [value]="country.id">
                      {{ country.countryName }}
                    </option>
                  }
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Form Section 2: Additional Info & Note -->
        <div class="form-section-card">
          <div class="form-section-header">
            <div class="d-flex align-items-center gap-2">
              <i class="fa-solid fa-align-left text-primary"></i>
              <span class="fw-bold">{{ 'common.otherInfo' | translate }}</span>
            </div>
            <span class="badge-soft badge-indigo">
              <i class="fa-solid fa-list-check"></i> 1 {{ 'common.fields' | translate }}
            </span>
          </div>

          <div class="row g-3">
            <div class="col-12">
              <label for="inputProvinceNote" class="form-label custom-form-label">
                {{ 'common.note' | translate }}
              </label>
              <div class="input-group custom-input-group">
                <span class="input-group-text"><i class="fa-solid fa-align-left"></i></span>
                <textarea
                  class="form-control custom-form-control"
                  id="inputProvinceNote"
                  rows="3"
                  placeholder="{{ 'common.placeholderNote' | translate }}"
                  formControlName="note"
                ></textarea>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </ng-container>

  <ng-container modal-actions>
    <button
      type="submit"
      form="provinceEditorForm"
      class="btn btn-sm btn-pastel-purple px-4 py-2 rounded-3"
    >
      @if (isSaving()) {
        <span class="spinner-border spinner-border-sm me-1"></span>{{ 'common.saving' | translate }}
      } @else {
        <i class="fa-solid fa-floppy-disk me-1"></i>{{ 'common.save' | translate }}
      }
    </button>
  </ng-container>
</app-modal>
