<div
  class="modal fade custom-modal"
  id="countryExportModal"
  tabindex="-1"
  aria-labelledby="countryExportModalTitle"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow-2xl rounded-5 overflow-hidden">
      <!-- Ambient Radial Glow Backdrop & Top Accent Line -->
      <div class="modal-bg-glow"></div>
      <div class="modal-top-accent-bar"></div>

      <!-- Modal Header -->
      <div
        class="modal-header border-0 px-4 pt-4 pb-3 position-relative d-flex align-items-start justify-content-between z-1"
      >
        <div class="d-flex align-items-center gap-3">
          <div class="modal-icon-badge" id="exportModalHeaderBadge">
            <i class="fa-solid fa-file-export text-indigo"></i>
          </div>
          <div>
            <div class="modal-eyebrow-tag mb-1" id="exportModalHeaderEyebrow">
              <span class="eyebrow-dot"></span> DATA EXPORT WIZARD
            </div>
            <h5
              class="modal-title fw-bold text-dark mb-0 d-flex align-items-center gap-2"
              id="countryExportModalTitle"
            >
              <i class="fa-solid fa-file-export text-indigo me-1"></i>
              <span>Export Country Data</span>
            </h5>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span class="badge-soft badge-indigo d-none d-sm-inline-flex">
            <i class="fa-solid fa-file-excel"></i> Excel / CSV
          </span>
          <button
            type="button"
            class="custom-btn-close ms-1"
            data-bs-dismiss="modal"
            aria-label="Close"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>

      <!-- Modal Body -->
      <form id="countryExportForm">
        <div class="modal-body px-4 py-3 position-relative z-1">
          <!-- Section 1: Export Range Selection -->
          <div class="form-section-card mb-4">
            <div class="form-section-header">
              <div class="d-flex align-items-center gap-2">
                <i class="fa-solid fa-layer-group text-primary"></i>
                <span class="fw-bold">EXPORT RANGE / SCOPE</span>
              </div>
              <span class="badge-soft badge-orange">
                <i class="fa-solid fa-list-check"></i> 3 Options
              </span>
            </div>

            <div class="row g-3">
              <!-- Radio 1: All Pages -->
              <div class="col-12">
                <label
                  class="custom-radio-card d-flex align-items-center justify-content-between p-3 rounded-4 border w-100 position-relative m-0"
                  for="exportScopeAll"
                >
                  <div class="d-flex align-items-center gap-3">
                    <input
                      class="form-check-input flex-shrink-0 ms-1 me-2"
                      type="radio"
                      name="exportScope"
                      id="exportScopeAll"
                      value="all"
                      checked
                    />
                    <div
                      class="rounded-3 p-2 bg-soft-indigo text-indigo d-flex align-items-center justify-content-center flex-shrink-0"
                      style="width: 42px; height: 42px"
                    >
                      <i class="fa-solid fa-database fs-5"></i>
                    </div>
                    <div>
                      <span class="fw-bold text-dark d-block mb-0 fs-6">All Pages</span>
                      <span class="text-muted small">Export complete dataset across all pages</span>
                    </div>
                  </div>
                  <span class="badge-soft badge-indigo px-3 py-1 me-1">120 Total Records</span>
                </label>
              </div>

              <!-- Radio 2: Current Page -->
              <div class="col-12">
                <label
                  class="custom-radio-card d-flex align-items-center justify-content-between p-3 rounded-4 border w-100 position-relative m-0"
                  for="exportScopeCurrent"
                >
                  <div class="d-flex align-items-center gap-3">
                    <input
                      class="form-check-input flex-shrink-0 ms-1 me-2"
                      type="radio"
                      name="exportScope"
                      id="exportScopeCurrent"
                      value="current"
                    />
                    <div
                      class="rounded-3 p-2 bg-soft-teal text-teal d-flex align-items-center justify-content-center flex-shrink-0"
                      style="width: 42px; height: 42px"
                    >
                      <i class="fa-solid fa-file-lines fs-5"></i>
                    </div>
                    <div>
                      <span class="fw-bold text-dark d-block mb-0 fs-6">Current Page</span>
                      <span class="text-muted small"
                        >Export 10 rows visible on current grid view</span
                      >
                    </div>
                  </div>
                  <span class="badge-soft badge-teal px-3 py-1 me-1">Page 1 (10 Rows)</span>
                </label>
              </div>

              <!-- Radio 3: Select Item / Selected Items -->
              <div class="col-12">
                <label
                  class="custom-radio-card d-flex align-items-center justify-content-between p-3 rounded-4 border w-100 position-relative m-0"
                  for="exportScopeSelected"
                >
                  <div class="d-flex align-items-center gap-3">
                    <input
                      class="form-check-input flex-shrink-0 ms-1 me-2"
                      type="radio"
                      name="exportScope"
                      id="exportScopeSelected"
                      value="selected"
                    />
                    <div
                      class="rounded-3 p-2 bg-soft-purple text-purple d-flex align-items-center justify-content-center flex-shrink-0"
                      style="width: 42px; height: 42px"
                    >
                      <i class="fa-solid fa-list-check fs-5"></i>
                    </div>
                    <div>
                      <span class="fw-bold text-dark d-block mb-0 fs-6">Selected Items</span>
                      <span class="text-muted small">Export checked items from data grid</span>
                    </div>
                  </div>
                  <span
                    class="badge-soft badge-purple px-3 py-1 me-1"
                    id="exportSelectedItemCountBadge"
                    >3 Items Selected</span
                  >
                </label>
              </div>
            </div>

            <!-- Progress Bar Container (hidden by default) -->
            <div class="import-progress-wrapper mt-3 d-none" id="exportProgressContainer">
              <div class="d-flex align-items-center justify-content-between mb-1">
                <span class="small fw-semibold text-muted" id="exportProgressStatusText"
                  >Generating export file...</span
                >
                <span class="small fw-bold text-indigo" id="exportProgressPercentText">0%</span>
              </div>
              <div class="progress custom-import-progress">
                <div
                  class="progress-bar bg-indigo progress-bar-striped progress-bar-animated rounded-pill"
                  id="exportProgressBar"
                  role="progressbar"
                  style="width: 0%"
                  aria-valuenow="0"
                  aria-valuemin="0"
                  aria-valuemax="100"
                ></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Modal Footer -->
        <div
          class="modal-footer px-4 py-3 border-top-0 d-flex align-items-center justify-content-between modal-footer-custom z-1"
        >
          <div class="d-none d-md-flex align-items-center gap-2 text-muted small">
            <i class="fa-solid fa-shield-halved text-primary opacity-75"></i>
            <span>Enterprise Encrypted</span>
            <span class="modal-footer-divider"></span>
            <span class="d-inline-flex align-items-center gap-1"
              ><kbd class="kbd-badge">ESC</kbd> Close</span
            >
          </div>
          <div class="d-flex align-items-center gap-2 ms-auto">
            <button
              type="button"
              class="btn btn-sm btn-pastel-slate px-3 py-2 rounded-3"
              data-bs-dismiss="modal"
            >
              <i class="fa-solid fa-xmark me-1"></i> Close
            </button>
            <button
              type="submit"
              class="btn btn-sm btn-pastel-indigo px-4 py-2 rounded-3"
              id="processExportBtn"
            >
              <i class="fa-solid fa-file-export me-1"></i> Start Export
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
