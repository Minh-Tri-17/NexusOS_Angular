<div class="toast-item toast-{{ safeType() }}" role="alert">
  <div class="toast-accent-bar"></div>

  <div class="toast-icon-box">
    <i [class]="resolvedIcon()"></i>
  </div>

  <div class="toast-content">
    <h6 class="toast-title">{{ title() }}</h6>
    @if (messages().length === 1) {
      <p class="toast-message">{{ messages()[0] }}</p>
    } @else if (messages().length > 1) {
      <ul class="mb-0 ps-3 text-secondary small">
        @for (item of messages(); track $index) {
          <li>{{ item }}</li>
        }
      </ul>
    }
  </div>

  <button type="button" class="toast-close" aria-label="Close" (click)="dismiss()">
    <i class="fa-solid fa-xmark"></i>
  </button>
</div>
