<div class="app-table-footer" role="region" aria-label="Table pagination footer">
  <div class="app-footer-left">
    <div class="app-footer-counter">
      <span id="countryResultCount"
        >Showing <strong>{{ recordRange() }}</strong> of
        <strong>{{ totalRecord() }}</strong> items</span
      >
    </div>
    <div class="app-footer-divider"></div>
    <div class="app-page-size-picker">
      <span>Rows per page:</span>
      <select
        id="countryPageSizeSelect"
        class="app-size-select"
        aria-label="Rows per page"
        [value]="pageSize()"
        (change)="handlePageSizeChange($event)"
      >
        <option value="20" selected>20</option>
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="200">200</option>
        <option value="500">500</option>
      </select>
    </div>
  </div>

  <div class="app-footer-center">
    <span class="app-jump-label">Go to page:</span>
    <form
      #jumpForm="ngForm"
      id="countryPageJumpForm"
      class="app-jump-form"
      (ngSubmit)="handlePageIndexChange(jumpInput.value)"
    >
      <input
        #jumpInput
        type="number"
        id="countryJumpInput"
        class="app-jump-input"
        aria-label="Target page number"
        required
        min="1"
        [max]="pageCount()"
        [value]="pageIndex()"
      />
      <span class="app-jump-total"
        >/ <span id="countryTotalPages">{{ pageCount() }}</span></span
      >
      <button type="submit" class="app-jump-btn" id="countryJumpGoBtn" title="Jump to page">
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>
  </div>

  <div class="app-footer-right" role="navigation" aria-label="Pagination Navigation">
    <button
      class="app-page-btn"
      id="countryFirstBtn"
      title="First page"
      aria-label="First page"
      [disabled]="pageIndex() <= 1"
      (click)="handlePageIndexChange(1)"
    >
      <i class="fa-solid fa-angles-left"></i>
    </button>
    <button
      class="app-page-btn"
      id="countryPrevBtn"
      title="Previous page"
      aria-label="Previous page"
      [disabled]="pageIndex() <= 1"
      (click)="handlePageIndexChange(pageIndex() - 1)"
    >
      <i class="fa-solid fa-chevron-left"></i>
    </button>

    <div class="d-flex align-items-center gap-1" id="countryPageNumbersGroup">
      @for (page of pages(); track page; let idx = $index) {
        <button
          class="app-page-btn"
          [class]="page === pageIndex() ? 'active' : ''"
          [attr.data-page]="page"
          [attr.aria-current]="page === pageIndex() ? 'page' : null"
          (click)="handlePageIndexChange(page)"
        >
          {{ page }}
        </button>
      }
    </div>

    <button
      class="app-page-btn"
      id="countryNextBtn"
      title="Next page"
      aria-label="Next page"
      [disabled]="pageIndex() >= pageCount()"
      (click)="handlePageIndexChange(pageIndex() + 1)"
    >
      <i class="fa-solid fa-chevron-right"></i>
    </button>
    <button
      class="app-page-btn"
      id="countryLastBtn"
      title="Last page"
      aria-label="Last page"
      [disabled]="pageIndex() >= pageCount()"
      (click)="handlePageIndexChange(pageCount())"
    >
      <i class="fa-solid fa-angles-right"></i>
    </button>
  </div>
</div>
