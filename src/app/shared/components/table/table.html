<div
  class="table-responsive rounded-3 app-table-scroll"
  [class]="containerClass()"
  [style.maxHeight]="maxHeight() || null"
  style="overflow-x: auto; max-width: 100%"
>
  <table
    class="app-list-table"
    [class]="tableClass()"
    [style.minWidth]="minWidth()"
    style="width: 100%"
  >
    <thead>
      <ng-content select="[table-header]"></ng-content>
    </thead>
    <tbody>
      <ng-content select="[table-body]"></ng-content>
    </tbody>
  </table>
</div>
