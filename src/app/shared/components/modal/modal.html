<div
  class="modal fade custom-modal"
  id="countryFormModal"
  tabindex="-1"
  aria-labelledby="countryModalTitle"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow-2xl rounded-5 overflow-hidden">
      <!-- Ambient Radial Glow Backdrop & Top Accent Line -->
      <div class="modal-bg-glow"></div>
      <div class="modal-top-accent-bar"></div>

      <!-- Modal Header -->
      <div
        class="modal-header border-0 px-4 pt-4 pb-3 position-relative d-flex align-items-start justify-content-between z-1"
      >
        <div class="d-flex align-items-center gap-3">
          <div class="modal-icon-badge" id="modalHeaderBadge">
            <i class="fa-solid fa-earth-americas"></i>
          </div>
          <div>
            <div class="modal-eyebrow-tag mb-1" id="modalHeaderEyebrow">
              <span class="eyebrow-dot"></span> GLOBAL GEOGRAPHY MODULE
            </div>
            <h5
              class="modal-title fw-bold text-dark mb-0 d-flex align-items-center gap-2"
              id="countryModalTitle"
            >
              <i class="fa-solid fa-earth-americas text-primary"></i>
              <span>Create New Country</span>
            </h5>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span class="badge-soft badge-teal d-none d-sm-inline-flex">
            <i class="fa-solid fa-bolt"></i> Live Sync
          </span>
          <button
            type="button"
            class="custom-btn-close ms-1"
            data-bs-dismiss="modal"
            aria-label="Close"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>

      <!-- Modal Form & Body -->
      <form id="countryModalForm">
        <div class="modal-body px-4 py-3 position-relative z-1">
          <!-- Form Section 1: Basic & Geography Information -->
          <div class="form-section-card mb-4">
            <div class="form-section-header">
              <div class="d-flex align-items-center gap-2">
                <i class="fa-solid fa-globe text-primary"></i>
                <span class="fw-bold">GEOGRAPHIC IDENTIFICATION</span>
              </div>
              <span class="badge-soft badge-indigo">
                <i class="fa-solid fa-list-check"></i> 4 fields
              </span>
            </div>
            <div class="row g-3">
              <!-- Country Code -->
              <div class="col-md-6">
                <label for="modalCountryCode" class="form-label custom-form-label">
                  Country Code (ISO)
                  <span class="text-danger fw-bold">*</span>
                </label>
                <div class="input-group custom-input-group">
                  <span class="input-group-text"><i class="fa-solid fa-passport"></i></span>
                  <input
                    type="text"
                    class="form-control custom-form-control"
                    id="modalCountryCode"
                    placeholder="e.g. VN, US, JP"
                    required
                  />
                </div>
                <div class="form-text-hint">
                  <i class="fa-solid fa-circle-info"></i> Standard ISO 3166-1 alpha-2 code
                </div>
              </div>

              <!-- Country Name -->
              <div class="col-md-6">
                <label for="modalCountryName" class="form-label custom-form-label">
                  Country Name <span class="text-danger fw-bold">*</span>
                </label>
                <div class="input-group custom-input-group">
                  <span class="input-group-text"><i class="fa-solid fa-flag"></i></span>
                  <input
                    type="text"
                    class="form-control custom-form-control"
                    id="modalCountryName"
                    placeholder="e.g. Vietnam, Japan"
                    required
                  />
                </div>
                <div class="form-text-hint">
                  <i class="fa-solid fa-circle-info"></i> Official country display name
                </div>
              </div>

              <!-- Region / Continent -->
              <div class="col-md-6">
                <label for="modalCountryRegion" class="form-label custom-form-label">
                  Region / Continent
                  <span class="text-danger fw-bold">*</span>
                </label>
                <div class="input-group custom-input-group">
                  <span class="input-group-text"><i class="fa-solid fa-compass"></i></span>
                  <select class="form-select custom-form-select" id="modalCountryRegion" required>
                    <option value="" disabled selected>Select Region...</option>
                    <option value="Asia">Asia (Châu Á)</option>
                    <option value="Europe">Europe (Châu Âu)</option>
                    <option value="North America">North America (Bắc Mỹ)</option>
                    <option value="South America">South America (Nam Mỹ)</option>
                    <option value="Oceania">Oceania (Châu Đại Dương)</option>
                    <option value="Africa">Africa (Châu Phi)</option>
                  </select>
                </div>
              </div>

              <!-- Dialing Code -->
              <div class="col-md-6">
                <label for="modalDialCode" class="form-label custom-form-label">
                  Phone Dialing Code
                </label>
                <div class="input-group custom-input-group">
                  <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                  <input
                    type="text"
                    class="form-control custom-form-control"
                    id="modalDialCode"
                    placeholder="e.g. +84, +1, +81"
                  />
                </div>
                <div class="form-text-hint">
                  <i class="fa-solid fa-circle-info"></i> International phone prefix (E.164)
                </div>
              </div>
            </div>
          </div>

          <!-- Form Section 2: Operations & Priority Settings -->
          <div class="form-section-card">
            <div class="form-section-header">
              <div class="d-flex align-items-center gap-2">
                <i class="fa-solid fa-sliders text-primary"></i>
                <span class="fw-bold">OPERATIONS & CLASSIFICATION</span>
              </div>
              <span class="badge-soft badge-amber">
                <i class="fa-solid fa-sliders"></i> 2 fields
              </span>
            </div>
            <div class="row g-3">
              <!-- Priority Level -->
              <div class="col-md-6">
                <label for="modalCountryPriority" class="form-label custom-form-label"
                  >Priority Level</label
                >
                <div class="input-group custom-input-group">
                  <span class="input-group-text"
                    ><i class="fa-solid fa-star text-warning"></i
                  ></span>
                  <select class="form-select custom-form-select" id="modalCountryPriority">
                    <option value="High">High (Cao)</option>
                    <option value="Standard" selected>Standard (Tiêu chuẩn)</option>
                    <option value="Low">Low (Thấp)</option>
                  </select>
                </div>
              </div>

              <!-- Operational Status -->
              <div class="col-md-6">
                <label for="modalCountryStatus" class="form-label custom-form-label"
                  >Operational Status</label
                >
                <div class="input-group custom-input-group">
                  <span class="input-group-text"
                    ><i class="fa-solid fa-circle-check text-success"></i
                  ></span>
                  <select class="form-select custom-form-select" id="modalCountryStatus">
                    <option value="Active" selected>Active (Đang hoạt động)</option>
                    <option value="Inactive">Inactive (Tạm ngừng)</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Modal Footer (Exact Buttons Preserved & Keyboard Shortcuts Added) -->
        <div
          class="modal-footer px-4 py-3 border-top-0 d-flex align-items-center justify-content-between modal-footer-custom z-1"
        >
          <div class="d-none d-md-flex align-items-center gap-2 text-muted small">
            <i class="fa-solid fa-shield-halved text-primary opacity-75"></i>
            <span>Enterprise encrypted</span>
            <span class="modal-footer-divider"></span>
            <span class="d-inline-flex align-items-center gap-1"
              ><kbd class="kbd-badge">ESC</kbd> Close</span
            >
          </div>
          <div class="d-flex align-items-center gap-2 ms-auto">
            <button
              type="button"
              class="btn btn-sm btn-pastel-slate px-3 py-2 rounded-3"
              data-bs-dismiss="modal"
            >
              <i class="fa-solid fa-xmark me-1"></i> Close
            </button>
            <button
              type="submit"
              class="btn btn-sm btn-pastel-purple px-4 py-2 rounded-3"
              id="saveCountryBtn"
            >
              <i class="fa-solid fa-floppy-disk me-1"></i> Save Changes
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
