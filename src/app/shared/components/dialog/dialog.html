<div class="modal-body p-4 text-center">
  <div
    class="mx-auto mb-3 d-flex align-items-center justify-content-center rounded-circle dialog-icon-wrapper"
    [style.width.px]="50"
    [style.height.px]="50"
    [style.backgroundColor]="iconBgColor()"
    [style.color]="iconColor()"
  >
    <i [class]="iconClass()" class="fs-4"></i>
  </div>

  <h5 class="fw-bold text-dark mb-2 dialog-title">
    {{ title() }}
  </h5>

  <p class="text-secondary small mb-4 dialog-message">
    {{ message() }}
  </p>

  <div class="d-flex align-items-center justify-content-center gap-2">
    <button
      type="button"
      class="btn btn-sm btn-pastel-slate px-3 py-2 rounded-3 fw-semibold flex-fill"
      (click)="handleCancel()"
    >
      {{ cancelText() }}
    </button>
    <button
      type="button"
      class="btn btn-sm btn-pastel-red px-3 py-2 rounded-3 fw-semibold flex-fill"
      [ngClass]="confirmBtnClass()"
      (click)="handleConfirm()"
    >
      {{ confirmText() }}
    </button>
  </div>
</div>
