<div
  class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3 pb-3 filter-toolbar-border"
>
  <div class="d-flex flex-wrap align-items-center gap-2">
    <div class="position-relative" style="min-width: 240px">
      <i
        class="fa-solid fa-magnifying-glass position-absolute top-50 start-0 translate-middle-y ms-3 filter-search-icon"
        (click)="handleSearch(searchInput.value)"
      ></i>
      <input
        #searchInput
        type="text"
        class="form-control form-control-sm ps-5 pe-3 rounded-3 filter-input"
        placeholder="Search name, code..."
        [value]="searchText()"
        (keyup.enter)="handleSearch(searchInput.value)"
      />
    </div>

    <button
      class="btn btn-sm btn-pastel-slate d-inline-flex align-items-center gap-2 px-3 rounded-3"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#smartFilterMatrixCollapse"
      aria-expanded="false"
      aria-controls="smartFilterMatrixCollapse"
      id="toggleFilterBarBtn"
    >
      <i class="fa-solid fa-sliders text-primary"></i> Filter
    </button>

    <label
      class="d-inline-flex align-items-center gap-2 ms-md-1 px-3 py-1 bg-light border rounded-3 text-nowrap user-select-none shadow-xs"
      style="cursor: pointer; height: 31px"
      for="chkIsDelete"
    >
      <span class="nexus-toggle-switch">
        <input
          type="checkbox"
          id="chkIsDelete"
          class="nexus-toggle-input"
          [checked]="filterIsDelete()"
          (click)="handleToggleShowDelete()"
        />
        <span class="nexus-toggle-slider"></span>
      </span>
      <span class="small fw-semibold text-secondary mb-0">
        <i class="fa-solid fa-trash-arrow-up text-danger me-1"></i> Show Deleted
      </span>
    </label>
  </div>

  <div class="d-flex align-items-center gap-2 flex-wrap ms-auto">
    <ng-content select="[action-buttons]"></ng-content>
  </div>
</div>

<div class="active-filter-chips-bar mb-3">
  <span class="text-muted small fw-semibold me-1">Active Filters:</span>

  @if (filterIsDelete()) {
    <span class="filter-chip chip-is-delete">
      <i class="fa-solid fa-trash-arrow-up chip-icon text-danger"></i> Filter:
      <strong class="text-danger">Show Deleted</strong>
      <i class="fa-solid fa-xmark chip-remove-btn" (click)="filterIsDelete.set(false)"></i>
    </span>
  }

  <ng-content select="[active-filters]"></ng-content>

  <button
    class="btn btn-link text-muted p-0 border-0 btn-clear-all-chips ms-auto"
    (click)="handleClearFilters()"
  >
    <i class="fa-solid fa-trash-can me-1"></i> Clear All
  </button>
</div>

<div class="collapse" id="smartFilterMatrixCollapse">
  <div class="smart-filter-matrix mb-3">
    <div class="d-flex align-items-center justify-content-between mb-3 pb-2 border-bottom">
      <span class="fw-bold small text-muted text-uppercase tracking-wider">
        <i class="fa-solid fa-sliders text-primary me-2"></i>Filter Criteria Matrix
      </span>
      <span class="text-muted small">Select criteria to refine results</span>
    </div>
    <div class="row g-3">
      <ng-content select="[filter-matrix]"></ng-content>
    </div>
  </div>
</div>
