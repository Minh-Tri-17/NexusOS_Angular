server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip nén các file tĩnh giúp trang tải nhanh hơn
    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Reverse proxy cho API: Nginx sẽ đón các request /api/ và chuyển tiếp sang backend container
    location /api/ {
        proxy_pass http://nexus-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy cho Swagger UI (thuận tiện khi cần test API từ cùng domain/port)
    location /swagger/ {
        proxy_pass http://nexus-backend:8080/swagger/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA routing: Mọi request không khớp file tĩnh sẽ được chuyển về index.html của Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

